[package]
name = "telemetry-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
kafka = ["dep:rdkafka"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rdkafka = { version = "0.39", features = ["cmake-build"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
