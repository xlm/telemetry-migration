[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-migration-harness"
version = "0.1.0"
description = "Validation and evidence tooling for telemetry migrations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1,<9",
    "jsonschema>=4.23,<5",
    "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
